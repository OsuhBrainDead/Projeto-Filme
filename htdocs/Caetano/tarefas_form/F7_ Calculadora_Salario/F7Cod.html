<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Salário</title>
</head>
<body>
    <h2>Calculadora de Salário</h2>
    <form method="POST" action="F7Cod.php">
        <label>Nome:</label><br>
        <input type="text" name="nome" required><br><br>

        <label>Salário base (R$):</label><br>
        <input type="number" step="0.01" name="salario_base" required><br><br>

        <label>Horas extras realizadas:</label><br>
        <input type="number" name="horas_extras" required><br><br>

        <input type="submit" name="enviar" value="Calcular">
    </form>
</body>
</html>
