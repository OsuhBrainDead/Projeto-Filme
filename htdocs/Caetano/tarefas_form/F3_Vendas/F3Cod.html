<!DOCTYPE html>
<html>
<head>
    <title>Formulário de Vendas</title>
</head>
<body>
    <h2>Formulário de Vendas</h2>
    <form method="POST" action="F3Cod.php">
        <label>Nome do produto:</label><br>
        <input type="text" name="produto" required><br><br>

        <label>Quantidade:</label><br>
        <input type="number" name="quantidade" required><br><br>

        <label>Valor unitário (R$):</label><br>
        <input type="number" step="0.01" name="valor_unitario" required><br><br>

        <input type="submit" name="enviar" value="Calcular">
    </form>
</body>
</html>
