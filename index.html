<DOCTYPE html>
    <html lang="pt_BR">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
            <title> CineAcolhe - seu cinema pessoal</title>
            <style>
                /* reset  */
                *{ margin: 0; padding: 0; box-sizing: border-box;}

            body{
                font-family:'segoe UI', arial, sans-serif;
                background: #0d0d0d;
                color: #f0f0f0;
                padding-Bottom: 60px;
                line-height: 1.6;
            }
            a {color: #e50914; text-decoration: none;}
            .container{
                max-width:1300px;
                margin: 0 auto;
                padding: 0 20px;
            }
            /* header*/
            header{
                background: #1a1a1a;
                padding: 15px 0;
                border-bottom: 2 px solid #e50914;
                position: sticky;
                top: 0;
                z-index: 100;
            }
             header .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
             }
             .logo{
                font-size: 28px;
                font-weight:900;
                color:#e50914;
                letter-spacing:-1px;
             }
             .logo span{ color:#fff;}
            
             .nav-links{
                display: flex;
                gap: 20px;
                align-items:center;
                flex-wrap:wrap;
             }
             .nav-links a { 
                color: #ccc;
                font-size: 14px;
                transition: 0.3s;
             }
            .nav-links a:hover {color:#e50914;}
            /*botões*/
            .btn{
                padding:8px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size:14px
            }
            </style>
        </head>
    </html>
